[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscan"
version = "0.1.0"
description = "Scan agent skills (SKILL.md and bundled files) for prompt injection and related abuse"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
skillscan = "skillscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
